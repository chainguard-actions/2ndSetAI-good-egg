name: Test invalid event - no PR data in event file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create event file without PR data
        run: |
          cat > /tmp/fake-push-event.json <<'EOF'
          {
            "ref": "refs/heads/main",
            "repository": {
              "full_name": "octocat/Hello-World"
            },
            "pusher": {
              "name": "octocat"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/fake-push-event.json
          GITHUB_REPOSITORY: octocat/Hello-World
        with:
          github-token: ${{ github.token }}
          comment: 'false'
          check-run: 'false'
          fail-on-low: 'false'

      - name: Assert action fails gracefully when event has no PR data
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when event has no PR data, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected when event has no PR data"
