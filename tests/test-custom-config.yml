name: Test custom config path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake PR event file
        run: |
          cat > /tmp/fake-pr-event-config.json <<'EOF'
          {
            "pull_request": {
              "number": 42,
              "user": {
                "login": "octocat"
              },
              "head": {
                "sha": "abc1234567890abcdef1234567890abcdef123456"
              }
            }
          }
          EOF

      - name: Create custom config file
        run: |
          cat > /tmp/good-egg-config.yml <<'EOF'
          thresholds:
            high: 0.7
            medium: 0.4
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/fake-pr-event-config.json
          GITHUB_REPOSITORY: octocat/Hello-World
        with:
          github-token: ${{ github.token }}
          config-path: /tmp/good-egg-config.yml
          comment: 'false'
          check-run: 'false'
          fail-on-low: 'false'

      - name: Assert action produced outputs or failed gracefully with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCORE: ${{ steps.action.outputs.score }}
          TRUST_LEVEL: ${{ steps.action.outputs.trust-level }}
          USER: ${{ steps.action.outputs.user }}
        run: |
          echo "outcome: $OUTCOME"
          echo "score: $SCORE"
          echo "trust-level: $TRUST_LEVEL"
          echo "user: $USER"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SCORE" ]; then
              echo "FAIL: action succeeded but score output is empty"
              exit 1
            fi
            if [ -z "$TRUST_LEVEL" ]; then
              echo "FAIL: action succeeded but trust-level output is empty"
              exit 1
            fi
            case "$TRUST_LEVEL" in
              HIGH|MEDIUM|LOW|UNKNOWN|BOT)
                echo "PASS: trust-level '$TRUST_LEVEL' is valid"
                ;;
              *)
                echo "FAIL: unexpected trust-level '$TRUST_LEVEL'"
                exit 1
                ;;
            esac
            echo "PASS: custom config accepted, score=$SCORE trust-level=$TRUST_LEVEL user=$USER"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API rate limit or sentinel repo issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
