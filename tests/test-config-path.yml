name: Test config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake PR event file
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/pr-event.json <<'EOF'
          {
            "action": "opened",
            "number": 1,
            "pull_request": {
              "number": 1,
              "user": {"login": "octocat", "type": "User"},
              "head": {"ref": "feature-branch", "sha": "abc123"},
              "base": {"ref": "main", "sha": "def456"},
              "title": "Test PR",
              "body": "Test PR body"
            },
            "sender": {"login": "octocat", "type": "User"}
          }
          EOF

      - name: Verify fixture config exists
        run: |
          test -f "$GITHUB_WORKSPACE/hardened/tests/fixtures/good-egg.yml" \
            || test -f "$GITHUB_WORKSPACE/tests/fixtures/good-egg.yml" \
            || echo "note: fixture not found at expected path"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: /tmp/github-events/pr-event.json
          GITHUB_HEAD_REF: feature-branch
          GITHUB_BASE_REF: main
          GITHUB_REF: refs/pull/1/merge
        with:
          github-token: ${{ github.token }}
          config-path: tests/fixtures/good-egg.yml
          comment: 'false'
          check-run: 'false'
          fail-on-low: 'false'

      - name: Assert action ran with config-path
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TRUST: ${{ steps.action.outputs.trust-level }}
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "outcome: $OUTCOME"
          echo "trust-level: $TRUST"
          echo "score: $SCORE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$TRUST" ]; then
              case "$TRUST" in
                HIGH|MEDIUM|LOW|UNKNOWN|BOT|EXISTING_CONTRIBUTOR) echo "PASS: valid trust level" ;;
                *) echo "FAIL: unexpected trust-level '$TRUST'"; exit 1 ;;
              esac
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
