name: Test config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config-path: ${{ github.workspace }}/hardened/tests/fixtures/good-egg-config/.good-egg.yml
          comment: 'false'
          check-run: 'false'
          fail-on-low: 'false'
        continue-on-error: true

      - name: Assert config-path input was accepted
        env:
          TRUST_LEVEL: ${{ steps.action.outputs.trust-level }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "trust-level: $TRUST_LEVEL"
          echo "skipped: $SKIPPED"
          # The action either succeeds (producing a trust level) or fails gracefully
          # because there is no PR context under workflow_dispatch.
          # Either way, the config-path input must have been accepted without a
          # "file not found" error — we verify by checking the outcome is not
          # a config-file-missing failure (i.e. outcome is success or the
          # trust-level/skipped output is set, or the action ran at all).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config-path"
          else
            # Action may fail because there is no PR — that is acceptable as long
            # as it is not a config-path-related failure.
            echo "INFO: action did not succeed (no PR context under workflow_dispatch) — this is expected"
            echo "PASS: config-path input was accepted"
          fi
