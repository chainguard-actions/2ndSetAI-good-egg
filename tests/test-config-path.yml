name: Test config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config-path: ${{ github.workspace }}/actions/hardened/2ndSetAI--good-egg/v0.1.2/tests/fixtures/good-egg-config/.good-egg.yml
          comment: 'false'
          check-run: 'false'
          fail-on-low: 'false'
        continue-on-error: true
      - name: Assert action ran with config-path
        env:
          TRUST_LEVEL: ${{ steps.action.outputs.trust-level }}
          SCORE: ${{ steps.action.outputs.score }}
          USER: ${{ steps.action.outputs.user }}
        run: |
          echo "trust-level: $TRUST_LEVEL"
          echo "score: $SCORE"
          echo "user: $USER"
          # The action may return UNKNOWN when not in a real PR context
          # but it should still run without crashing when config-path is provided
          if [ -n "$TRUST_LEVEL" ]; then
            echo "PASS: trust-level output is set to '$TRUST_LEVEL'"
          else
            echo "INFO: trust-level output not set (expected in non-PR context)"
            echo "PASS: action ran with config-path without crashing"
          fi
