name: Test config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a good-egg config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/.good-egg.yml" <<'EOF'
          thresholds:
            high: 0.7
            medium: 0.4
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-path: hardened/tests/fixtures/.good-egg.yml
          comment: 'false'
          check-run: 'false'
          fail-on-low: 'false'

      - name: Assert action ran with config-path (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCORE: ${{ steps.action.outputs.score }}
          TRUST_LEVEL: ${{ steps.action.outputs.trust-level }}
        run: |
          echo "outcome: $OUTCOME"
          echo "score: $SCORE"
          echo "trust-level: $TRUST_LEVEL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TRUST_LEVEL" ]; then
              echo "FAIL: action succeeded but trust-level output is empty"
              exit 1
            fi
            echo "PASS: got trust-level '$TRUST_LEVEL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / no PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
