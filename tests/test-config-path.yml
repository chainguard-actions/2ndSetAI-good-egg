name: Test config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal good-egg config file
        run: |
          mkdir -p /tmp/good-egg-config
          cat > /tmp/good-egg-config/.good-egg.yml <<'EOF'
          scoring_model: v1
          fail_on_low: false
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-path: /tmp/good-egg-config/.good-egg.yml
          comment: 'false'
          check-run: 'false'
          fail-on-low: 'false'

      - name: Assert action ran with config-path input
        run: |
          echo "Action completed (may fail due to no real PR context in act)"
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: config-path input was accepted"
