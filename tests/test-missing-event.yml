name: Test missing event path - graceful failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/nonexistent-event-file.json
          GITHUB_REPOSITORY: octocat/Hello-World
        with:
          github-token: ${{ github.token }}
          comment: 'false'
          check-run: 'false'
          fail-on-low: 'false'

      - name: Assert action fails gracefully when event file is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when event file is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected when event file is missing"
