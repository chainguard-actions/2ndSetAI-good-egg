name: Test basic usage (no PR context)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          comment: 'false'
          check-run: 'false'
          fail-on-low: 'false'
        continue-on-error: true

      - name: Assert action ran (outputs present or action handled non-PR gracefully)
        env:
          TRUST_LEVEL: ${{ steps.action.outputs.trust-level }}
          SCORE: ${{ steps.action.outputs.score }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "trust-level: $TRUST_LEVEL"
          echo "score: $SCORE"
          echo "skipped: $SKIPPED"
          # Under workflow_dispatch there is no PR, so the action may:
          # 1. Succeed with UNKNOWN/BOT/EXISTING_CONTRIBUTOR trust level
          # 2. Succeed with empty outputs (no PR to score)
          # 3. Fail gracefully (non-zero exit but we continue-on-error)
          # We just verify the action ran without crashing the runner
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
