name: Test scoring-model v1 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          comment: 'false'
          check-run: 'false'
          fail-on-low: 'false'
          scoring-model: 'v1'
        continue-on-error: true

      - name: Assert action accepted scoring-model=v1 input
        env:
          SCORING_MODEL: ${{ steps.action.outputs.scoring-model }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "scoring-model output: $SCORING_MODEL"
          # The action should complete (success or failure due to no PR context)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with scoring-model=v1 (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          # If the action succeeded and returned a scoring-model output, verify it
          if [ "$OUTCOME" = "success" ] && [ -n "$SCORING_MODEL" ]; then
            if [ "$SCORING_MODEL" = "v1" ]; then
              echo "PASS: scoring-model output matches v1"
            else
              echo "INFO: scoring-model output is '$SCORING_MODEL' (may differ from input)"
            fi
          fi
