name: Good Egg

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: 2ndSetAI/good-egg@9d3e310471fa5ea76f5f47ec6d917ed41cdc4649 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-known-contributors: 'false'
